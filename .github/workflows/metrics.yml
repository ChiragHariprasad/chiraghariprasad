name: GitHub Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # ISOMETRIC CONTRIBUTION CALENDAR
      # ==========================================================
      - name: Generate isometric calendar
        uses: lowlighter/metrics@master
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: ChiragHariprasad
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: Asia/Kolkata
          config_padding: 8

          output_action: none
          delay: 120

          plugins_errors_fatal: yes


      # ==========================================================
      # FEATURED REPOSITORIES
      # ==========================================================
      - name: Generate featured repositories
        uses: lowlighter/metrics@master
        with:
          filename: metrics.plugin.repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: ChiragHariprasad
          base: ""

          plugin_repositories: yes

          plugin_repositories_featured: >-
            ChiragHariprasad/V.E.C.T.O.R-Velocity_Enhanced_Clustering_and_Transactional_Outlier_Recognition,
            ChiragHariprasad/APe,
            ChiragHariprasad/meetingsAI,
            ChiragHariprasad/O.R.I.O.N.Omni-Retail-Intelligence---Ordering-Network,
            ChiragHariprasad/SENTINEL,
            ChiragHariprasad/aeroweight

          plugin_repositories_order: featured

          config_timezone: Asia/Kolkata
          config_padding: 8

          output_action: none
          delay: 120

          plugins_errors_fatal: yes


      # ==========================================================
      # LANGUAGES
      # ==========================================================
      - name: Generate language statistics
        uses: lowlighter/metrics@master
        with:
          filename: metrics.plugin.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: ChiragHariprasad
          base: ""

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_details: bytes-size, percentage

          config_timezone: Asia/Kolkata
          config_padding: 8

          output_action: none
          delay: 120

          plugins_errors_fatal: yes
