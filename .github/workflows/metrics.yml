name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ---------------------------------------------------------
      # Isometric contribution calendar
      # ---------------------------------------------------------
      - name: Generate isometric calendar
        uses: lowlighter/metrics@master
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: ChiragHariprasad
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: Asia/Kolkata
          config_padding: 8


      # ---------------------------------------------------------
      # Languages
      # ---------------------------------------------------------
      - name: Generate language metrics
        uses: lowlighter/metrics@master
        with:
          filename: metrics.plugin.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: ChiragHariprasad
          base: ""

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_other: yes

          config_timezone: Asia/Kolkata
          config_padding: 8


      # ---------------------------------------------------------
      # Repository overview
      # ---------------------------------------------------------
      - name: Generate repository metrics
        uses: lowlighter/metrics@master
        with:
          filename: metrics.plugin.repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: ChiragHariprasad
          base: ""

          plugin_repositories: yes
          plugin_repositories_featured: >-
            ChiragHariprasad/V.E.C.T.O.R-Velocity_Enhanced_Clustering_and_Transactional_Outlier_Recognition,
            ChiragHariprasad/APe,
            ChiragHariprasad/meetingsAI,
            ChiragHariprasad/O.R.I.O.N.Omni-Retail-Intelligence---Ordering-Network,
            ChiragHariprasad/SENTINEL,
            ChiragHariprasad/aeroweight

          config_timezone: Asia/Kolkata
          config_padding: 8


      # ---------------------------------------------------------
      # Achievements
      # ---------------------------------------------------------
      - name: Generate achievements
        uses: lowlighter/metrics@master
        with:
          filename: metrics.plugin.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: ChiragHariprasad
          base: ""

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          config_timezone: Asia/Kolkata
          config_padding: 8


      # ---------------------------------------------------------
      # Recent activity
      # ---------------------------------------------------------
      - name: Generate recent activity
        uses: lowlighter/metrics@master
        with:
          filename: metrics.plugin.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: ChiragHariprasad
          base: ""

          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 30
          plugin_activity_filter: >-
            issue,pr,release,fork,review,ref/create

          config_timezone: Asia/Kolkata
          config_padding: 8
